<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PhysicsHub – Class 12 Physics Solutions</title>
<meta name="description" content="Chapter-wise Class 12 Physics solutions with step-by-step working, formulas, bookmarks and progress tracking.">
<meta property="og:title" content="PhysicsHub – Class 12 Physics Solutions">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root{--bg:#f6f4ff;--card:#fff;--ink:#1c1b3a;--mute:#6b6a8c;--line:#e6e3fa;--blue:#3b82f6;--purple:#8b5cf6;--pink:#ec4899;
--g:linear-gradient(120deg,#3b82f6,#8b5cf6 55%,#ec4899);--ans:#eafaf1;--ansb:#22a06b;--f:#eef2ff;--fb:#6366f1;--sh:0 8px 24px rgba(99,70,200,.12)}
[data-theme=dark]{--bg:#12112a;--card:#1c1b3a;--ink:#f1efff;--mute:#a9a7cc;--line:#32305a;--ans:#12332a;--ansb:#3ddc97;--f:#25254f;--fb:#8c8fff;--sh:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans","Noto Sans Devanagari",system-ui,sans-serif;
padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3,.logo{font-family:"Baloo 2","Noto Sans Devanagari",sans-serif;line-height:1.2;margin:0}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap}
.logo{font-size:1.5rem;font-weight:800;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav a{padding:6px 12px;border-radius:99px;text-decoration:none;font-weight:600;color:var(--mute)}
nav a.on,nav a:hover{background:var(--f);color:var(--fb)}
.btn{border:0;border-radius:99px;padding:8px 16px;background:var(--g);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.d{background:#e5484d}
.btn:disabled{opacity:.5;cursor:wait}
.icon{width:40px;height:40px;padding:0;border-radius:50%}
.hero{background:var(--g);color:#fff;border-radius:0 0 32px 32px;padding:36px 0 44px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800}.hero p{max-width:560px;opacity:.95;margin:.5rem 0 0}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.3);margin-top:18px;max-width:420px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .5s}
.search{margin:-24px auto 20px;display:block;width:calc(100% - 32px);max-width:560px;padding:14px 20px;border-radius:99px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));padding-bottom:40px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);position:relative;overflow:hidden}
a.card:hover{transform:translateY(-3px);transition:transform .2s}
.card::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--cg)}
.ci{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;background:var(--cg)}
.card h3{font-size:1.15rem}.card small{color:var(--mute)}
.tag{font-size:.8rem;border-radius:99px;padding:2px 10px;background:var(--f);color:var(--fb);align-self:flex-start}.tag.ok{background:var(--ans);color:var(--ansb)}
.read{max-width:760px;margin:0 auto;padding:16px;font-size:var(--fs,18px)}
.ch-head{background:var(--g);color:#fff;border-radius:24px;padding:22px;margin:16px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input{flex:1;min-width:160px;padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.sec{margin:28px 0 10px;padding:6px 16px;border-left:6px solid var(--purple);background:var(--f);border-radius:0 14px 14px 0;font-size:1.2em}
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0;box-shadow:var(--sh);overflow-x:auto}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.n{background:var(--g);color:#fff;border-radius:99px;min-width:34px;text-align:center;padding:2px 12px;font-weight:600}
.bmk{background:none;border:0;font-size:1.5rem;color:var(--pink);cursor:pointer}
.q p{margin:.35em 0}.q p.f{background:var(--f);border-left:4px solid var(--fb);padding:6px 12px;border-radius:10px}
.q p.a{background:var(--ans);border-left:4px solid var(--ansb);padding:6px 12px;border-radius:10px}
.pn{display:flex;justify-content:space-between;gap:8px;margin:28px 0}
.empty{text-align:center;padding:60px 16px;color:var(--mute)}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:16px 0;box-shadow:var(--sh)}
.ed{border:1px dashed var(--line);border-radius:14px;padding:10px;margin:10px 0}
.ed input,.ed textarea,.box input,.box select{width:100%;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.ed .row{display:flex;gap:8px;margin-bottom:6px}.ed .w{max-width:110px}.ed textarea{font-family:ui-monospace,monospace;font-size:.9rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;max-width:90%}
#toast.show{opacity:1}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--purple);border-radius:50%;animation:s .8s linear infinite;margin:60px auto}
@keyframes s{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--mute);padding:24px 16px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header.top,.tools,.pn,.bmk,footer,.noprint{display:none!important}body{background:#fff;color:#000}.q{box-shadow:none;break-inside:avoid}.ch-head{background:none;color:#000;border:1px solid #000}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#/">PhysicsHub</a>
  <nav aria-label="Main"><a href="#/" data-n="">Home</a><a href="#/chapters" data-n="chapters">Chapters</a><a href="#/bm" data-n="bm">Bookmarks</a><a href="#/about" data-n="about">About</a></nav>
  <button class="btn o icon" id="theme" aria-label="Switch light or dark mode">🌓</button>
</div></header>
<main id="app" aria-live="polite"><div class="spin" role="status" aria-label="Loading"></div></main>
<footer>PhysicsHub · Class 12 Physics</footer>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
/* ===== helpers ===== */
const $ = s => document.querySelector(s), app = $('#app');
const store = {get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const GR = ['linear-gradient(135deg,#bfdbfe,#c4b5fd)','linear-gradient(135deg,#ddd6fe,#fbcfe8)','linear-gradient(135deg,#fbcfe8,#bfdbfe)'];
let chapters = [], done = store.get('done',[]), bm = store.get('bm',[]), view = {blocks:[]};
let toastT; const toast = m => {const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3200)};
const math = el => typeof renderMathInElement==='function' && renderMathInElement(el,{throwOnError:false,delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});
const spin = () => app.innerHTML = '<div class="spin" role="status" aria-label="Loading"></div>';
const setTheme = t => {document.documentElement.dataset.theme=t;store.set('theme',t)};
setTheme(store.get('theme', matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('#theme').onclick = () => setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* ===== shared renderer (students + admin preview) ===== */
function renderBlocks(blocks, id, canMark=true){
  return blocks.map((b,i)=>{
    if(b.k==='sec') return `<h2 class="sec">${esc(b.text)}</h2>`;
    const key = b._key || id+':'+i, on = bm.some(x=>x.key===key), L = b.lines||[];
    return `<article class="q" data-t="${esc((b.n+' '+L.join(' ')).toLowerCase())}"><div class="qh"><span class="n">${esc(b.n)}</span>${canMark?`<button class="bmk" data-act="bm" data-key="${esc(key)}" data-i="${i}" aria-pressed="${on}" aria-label="Bookmark question ${esc(b.n)}">${on?'★':'☆'}</button>`:''}</div>`+
      L.map(l=>`<p class="${/\*\*/.test(l)?'a':/^\s*सूत्र/.test(l)?'f':''}">${fmt(l)}</p>`).join('')+`</article>`;
  }).join('');
}

/* ===== data ===== */
async function loadChapters(){const r=await fetch('chapters.json?v='+Date.now());if(!r.ok)throw new Error('chapters.json');chapters=await r.json()}

/* ===== student pages ===== */
function home(scroll){
  const pub = chapters.filter(c=>c.published), total = pub.length||chapters.length;
  const cnt = done.filter(id=>chapters.some(c=>c.id===id)).length, pct = Math.round(100*cnt/total);
  app.innerHTML = `<section class="hero"><div class="wrap"><h1>Class 12 Physics – Chapter-wise Solutions</h1>
  <p>Welcome! Pick a chapter and follow every solution step by step.</p>
  <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
  <p>${cnt} of ${total} chapters completed</p></div></section>
  <input class="search" id="cs" type="search" placeholder="Search chapters (e.g. optics, magnetism)" aria-label="Search chapters">
  <div class="wrap"><div class="grid" id="grid"></div></div>`;
  const draw = q => {
    const list = chapters.filter(c=>(c.title+' '+(c.title_hi||'')).toLowerCase().includes(q.toLowerCase()));
    $('#grid').innerHTML = list.map((c,i)=>{
      const inner = `<div class="ci" style="--cg:${GR[i%3]}">${esc(c.icon)}</div><h3>${c.position}. ${esc(c.title)}</h3><small>${esc(c.title_hi||'')}</small>
      ${c.published?(done.includes(c.id)?'<span class="tag ok">Completed</span>':'<span class="tag">Open solutions</span>'):'<span class="tag">Coming soon</span>'}`;
      return c.published ? `<a class="card" style="--cg:${GR[i%3]}" href="#/c/${c.id}">${inner}</a>` : `<div class="card" style="--cg:${GR[i%3]};opacity:.65">${inner}</div>`;
    }).join('') || '<p class="empty">No chapter matches. Try another word.</p>';
  };
  draw(''); $('#cs').oninput = e => draw(e.target.value);
  if(scroll) $('#cs').scrollIntoView();
}

async function chapter(id){
  const ch = chapters.find(c=>c.id===id); if(!ch||!ch.published) return location.hash='#/';
  spin();
  const r = await fetch('ch'+id+'.json?v='+Date.now()); const blocks = r.ok ? await r.json() : []; view = {blocks,id};
  const pub = chapters.filter(c=>c.published), k = pub.findIndex(c=>c.id===id), prev = pub[k-1], next = pub[k+1];
  document.title = ch.title+' – PhysicsHub';
  app.innerHTML = `<div class="read" id="read" style="--fs:${store.get('fs',18)}px">
  <div class="ch-head"><h1>${ch.position}. ${esc(ch.title)}</h1><div>${esc(ch.title_hi||'')}</div></div>
  <div class="tools"><input id="qs" type="search" placeholder="Search questions in this chapter" aria-label="Search questions">
   <button class="btn o icon" data-act="fs" data-d="-1" aria-label="Smaller text">A−</button><button class="btn o icon" data-act="fs" data-d="1" aria-label="Larger text">A+</button>
   <button class="btn o" onclick="print()">Print</button>
   <button class="btn" data-act="done" data-id="${id}">${done.includes(id)?'✓ Completed':'Mark completed'}</button></div>
  <div id="qs-out">${blocks.length?renderBlocks(blocks,id):'<p class="empty">Solutions for this chapter are being prepared.</p>'}</div>
  <div class="pn">${prev?`<a class="btn o" href="#/c/${prev.id}">← ${esc(prev.title)}</a>`:'<span></span>'}${next?`<a class="btn" href="#/c/${next.id}">${esc(next.title)} →</a>`:''}</div></div>`;
  math($('#qs-out'));
  $('#qs').oninput = e => {const q=e.target.value.toLowerCase();document.querySelectorAll('#qs-out .q').forEach(a=>a.hidden=!a.dataset.t.includes(q))};
}

function bookmarks(){
  const blocks = bm.map(x=>({k:'q',n:x.n,lines:x.lines,_key:x.key,ch:x.ch}));
  app.innerHTML = `<div class="read" id="read" style="--fs:${store.get('fs',18)}px"><h1>Bookmarks</h1>`+(blocks.length?
    blocks.map(b=>{const c=chapters.find(c=>c.id===b.ch);return `<p><a href="#/c/${b.ch}"><b>${esc(c?c.title:'Chapter '+b.ch)}</b></a></p>`+renderBlocks([b],0)}).join('')
    :'<p class="empty">Nothing saved yet. Tap ☆ on any question to keep it here.</p>')+'</div>';
  math(app);
}

function about(){
  app.innerHTML = `<div class="read"><div class="box"><h1>About PhysicsHub</h1><p>PhysicsHub turns Class 12 Physics solutions into easy-to-read web pages with clear steps, highlighted formulas and final answers.</p>
  <p>Your bookmarks, progress and text size are saved on this device.</p></div></div>`;
}

/* ===== events ===== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if(!el) return; const a = el.dataset.act;
  if(a==='fs'){const v=Math.min(30,Math.max(14,store.get('fs',18)+2*+el.dataset.d));store.set('fs',v);$('#read').style.setProperty('--fs',v+'px')}
  if(a==='done'){const id=+el.dataset.id;done=done.includes(id)?done.filter(x=>x!==id):[...done,id];store.set('done',done);el.textContent=done.includes(id)?'✓ Completed':'Mark completed'}
  if(a==='bm'){const key=el.dataset.key,b=view.blocks[+el.dataset.i]||bm.find(x=>x.key===key);
    if(bm.some(x=>x.key===key)) bm=bm.filter(x=>x.key!==key); else bm.push({key,ch:view.id,n:b.n,lines:b.lines});
    store.set('bm',bm); if(location.hash==='#/bm') bookmarks(); else {const on=bm.some(x=>x.key===key);el.textContent=on?'★':'☆';el.setAttribute('aria-pressed',on)}}
});

/* ===== router ===== */
async function route(){
  const [,a,b] = (location.hash.slice(1)||'/').split('/');
  document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.dataset.n===(a||'')));
  document.title = 'PhysicsHub – Class 12 Physics Solutions'; scrollTo(0,0);
  try{
    if(!chapters.length) await loadChapters();
    if(a==='c') return await chapter(+b);
    if(a==='bm') return bookmarks();
    if(a==='about') return about();
    home(a==='chapters');
  }catch(e){console.error(e);app.innerHTML=`<div class="empty"><h2>Could not load</h2><p>Check your internet and try again.</p><button class="btn" onclick="route()">Retry</button></div>`}
}
addEventListener('hashchange',route);
route();
</script>
</body>
</html>
